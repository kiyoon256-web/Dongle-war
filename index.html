    ctx.fillStyle = "rgba(255,226,168,.25)"; ctx.beginPath(); ctx.arc(W * 0.5, GY - 40, 92, 0, 7); ctx.fill();
    ctx.fillStyle = "rgba(255,230,220,.5)";
    for (let i = 0; i < 3; i++) {
      const cx = ((i * 340 + S.amb * (6 + i * 3)) % (W + 240)) - 120, cy = 70 + i * 34;
      ell(ctx, cx, cy, 52, 11); ell(ctx, cx + 26, cy - 8, 32, 10); ell(ctx, cx - 28, cy - 4, 26, 8);
    }
    hill(60, 0.006, 1, GY - 10, "#6b4a8c");
    hill(36, 0.011, 4, GY - 4, "#3f3170");
    ctx.fillStyle = "#2a2450"; ctx.fillRect(0, GY, W, H - GY);
    ctx.fillStyle = "#46407a"; ctx.fillRect(0, GY, W, 4);
    ctx.fillStyle = "rgba(255,255,255,.07)";
    for (let x = 18; x < W; x += 54) ctx.fillRect(x, GY + 18 + (x % 3) * 12, 22, 3);
  }
  function drawHouse(b) {
    const f = b.flash > 0, c = ctx;
    c.save(); c.translate(b.x, GY);
    c.fillStyle = "rgba(0,0,0,.25)"; ell(c, 0, 0, 44, 6);
    c.fillStyle = f ? "#fff" : "#fff1dc"; c.fillRect(-28, -52, 56, 52);
    c.fillStyle = f ? "#fff" : "#ff7a45"; poly(c, [[-38, -50], [0, -94], [38, -50]]);
    c.fillStyle = f ? "#fff" : "#c9552a"; c.fillRect(14, -90, 10, 24);
    c.fillStyle = f ? "#fff" : "#a8613c"; c.beginPath(); c.roundRect(-9, -30, 18, 30, [9, 9, 0, 0]); c.fill();
    c.fillStyle = f ? "#fff" : "#ffd166"; ell(c, 19, -34, 6, 7);
    c.fillStyle = "#fff"; ell(c, 0, -68, 8, 7); c.fillStyle = INK; ell(c, 2.5, -69, 1.4, 2); ell(c, -2.5, -69, 1.4, 2);
    c.restore();
  }
  function drawTower(b) {
    const f = b.flash > 0, c = ctx;
    c.save(); c.translate(b.x, GY);
    c.fillStyle = "rgba(0,0,0,.3)"; ell(c, 0, 0, 44, 6);
    c.fillStyle = f ? "#fff" : "#2e2060";
    poly(c, [[-32, 0], [-27, -92], [-16, -112], [-7, -98], [4, -128], [14, -102], [26, -94], [32, 0]]);
    c.fillStyle = f ? "#fff" : "#46349a"; poly(c, [[8, 0], [10, -96], [26, -94], [32, 0]]);
    c.fillStyle = "#ffd166"; ell(c, -3, -64, 9, 12); c.fillStyle = INK; ell(c, -1, -62, 3, 8);
    c.strokeStyle = "#241d4a"; c.lineWidth = 2; c.beginPath(); c.moveTo(4, -128); c.lineTo(4, -152); c.stroke();
    c.fillStyle = "#ff4d6d"; poly(c, [[4, -152], [24, -146], [4, -140]]);
    c.fillStyle = f ? "#fff" : "#2e2060"; ell(c, -26, -1, 8, 4); ell(c, 24, -1, 9, 4);
    c.restore();
  }
  function bar(x, y, w, ratio, col, txt) {
    ctx.fillStyle = "rgba(20,14,48,.8)"; ctx.beginPath(); ctx.roundRect(x - w / 2 - 2, y - 2, w + 4, 12, 6); ctx.fill();
    ctx.fillStyle = col; ctx.beginPath(); ctx.roundRect(x - w / 2, y, Math.max(0, w * ratio), 8, 4); ctx.fill();
    ctx.fillStyle = "#fff"; ctx.font = "800 11px " + FONT; ctx.textAlign = "center"; ctx.fillText(txt, x, y - 6);
  }
  function drawEnt(e) {
    const d = e.def; let lunge = 0;
    if (e.st === "attack") {
      lunge = e.tm < d.wind ? (e.tm / d.wind) * -5 : Math.max(0, 1 - (e.tm - d.wind) / 0.15) * 12;
      if (d.range > 100) lunge *= 0.2;
    }
    ctx.save(); ctx.translate(e.x + e.dir * lunge, GY + e.y);
    if (e.dead) { const k = e.dead / 0.5; ctx.globalAlpha = Math.max(0, 1 - k); ctx.translate(0, -k * 18); }
    ctx.fillStyle = "rgba(0,0,0,.28)"; ell(ctx, 0, 0, d.w * 0.5, 5);
    ctx.save(); ctx.scale(e.dir, 1);
    art[d.kind](ctx, { t: e.t, f: e.flash > 0, mv: e.st === "walk", atk: e.st === "attack", tm: e.tm });
    ctx.restore();
    if (e.curse > 0 && !e.dead) {
      ctx.strokeStyle = "rgba(179,140,255,.9)"; ctx.lineWidth = 2.5;
      const a = e.t * 4; ctx.beginPath(); ctx.ellipse(0, -d.h - 8, 14, 4, 0, a, a + 4.2); ctx.stroke();
    }
    ctx.restore();
    if (!e.dead && e.hp < e.max) {
      const w = Math.max(26, d.w * 0.8), x = e.x - w / 2, y = GY + e.y - d.h - 12;
      ctx.fillStyle = "rgba(20,14,48,.75)"; ctx.fillRect(x - 1, y - 1, w + 2, 6);
      ctx.fillStyle = e.team ? "#ff6b81" : "#7ee0a0"; ctx.fillRect(x, y, w * Math.max(0, e.hp / e.max), 4);
    }
  }
  function render() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    if (S.shake > 0) ctx.translate((Math.random() - 0.5) * S.shake, (Math.random() - 0.5) * S.shake);
    drawBack();
    const b0 = S.base[0], b1 = S.base[1];
    if (b0) {
      drawHouse(b0); drawTower(b1);
      bar(b0.x, GY - 120, 84, b0.hp / b0.max, "#7ee0a0", Math.ceil(b0.hp));
      bar(b1.x, GY - 166, 84, b1.hp / b1.max, "#ff6b81", Math.ceil(b1.hp));
      const list = S.ents.slice().sort((a, b) => a.y - b.y);
      for (const e of list) drawEnt(e);
    } else {
      drawHouse({ x: PB, flash: 0 }); drawTower({ x: EB, flash: 0 });
    }
    for (const f of S.fx) {
      const k = f.t / f.dur; ctx.fillStyle = f.col;
      ctx.beginPath(); ctx.arc(f.x + (f.tx - f.x) * k, f.y + (f.ty - f.y) * k - Math.sin(k * Math.PI) * 14, f.r, 0, 7); ctx.fill();
    }
    for (const p of S.parts) { ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = p.col; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill(); }
    ctx.globalAlpha = 1;
    if (S.beam > 0) {
      const a = Math.min(1, S.beam / 0.4), g = ctx.createLinearGradient(PB, 0, W, 0);
      g.addColorStop(0, "rgba(255,244,214," + a + ")"); g.addColorStop(1, "rgba(255,122,69," + a * 0.2 + ")");
      ctx.fillStyle = g; const h = 70 * (0.6 + a * 0.4); ctx.fillRect(PB + 30, GY - 40 - h / 2, W, h);
    }
    ctx.restore();
  }

  /* ---------- UI sync ---------- */
  const el = { now: $("#moneyNow"), cap: $("#moneyCap"), wt: $("#walletTitle"), ws: $("#walletSub"), bw: $("#btnWallet"), bc: $("#btnCannon"), cs: $("#cannonSub"), cf: $("#cannonFill") };
  const cache = {};
  const setText = (k, node, v) => { if (cache[k] !== v) { cache[k] = v; node.textContent = v; } };
  function updateUI() {
    const play = S.mode === "play" || S.mode === "ending" || S.mode === "pause";
    const money = Math.floor(S.money);
    setText("now", el.now, won(play ? money : 0));
    setText("cap", el.cap, "최대 " + won(cap(S.wl)) + " · 초당 +" + won(rate(S.wl)));
    setText("wt", el.wt, "지갑 Lv " + S.wl);
    const maxed = S.wl >= WALLET_MAX;
    setText("ws", el.ws, maxed ? "최고 레벨" : "업그레이드 " + won(wCost(S.wl)));
    el.bw.disabled = !play || maxed || money < wCost(S.wl);
    const ready = S.charge >= CHARGE;
    setText("cs", el.cs, ready ? "발사!" : "충전 중 " + Math.floor((S.charge / CHARGE) * 100) + "%");
    el.bc.classList.toggle("ready", ready && play);
    el.bc.disabled = !play || !ready;
    el.cf.style.width = (S.charge / CHARGE) * 100 + "%";
    UNITS.forEach((d, i) => {
      const u = unitBtns[i], off = !play || S.cd[i] > 0 || money < d.cost;
      u.b.classList.toggle("off", off);
      u.cd.style.transform = "scaleY(" + (S.cd[i] > 0 ? S.cd[i] / d.cool : 0) + ")";
    });
  }

  /* ---------- loop ---------- */
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    S.amb += dt;
    if (S.mode === "play") { for (let i = 0; i < S.speed; i++) if (S.mode === "play") update(dt); }
    else if (S.mode === "ending") {
      S.endT -= dt; S.shake = Math.max(0, S.shake - dt * 22);
      for (const p of S.parts) { p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 260 * dt; }
      S.parts = S.parts.filter((p) => p.life > 0);
      if (S.endT <= 0) finish();
    }
    render(); updateUI();
    requestAnimationFrame(frame);
  }

  /* ---------- controls ---------- */
  function pause(on) {
    if (on && S.mode === "play") { S.mode = "pause"; $("#ovPause").hidden = false; $("#btnPause").textContent = "계속"; }
    else if (!on && S.mode === "pause") { S.mode = "play"; $("#ovPause").hidden = true; $("#btnPause").textContent = "일시정지"; }
  }
  $("#btnPause").addEventListener("click", () => pause(S.mode === "play"));
  $("#btnResume").addEventListener("click", () => pause(false));
  $("#btnQuit").addEventListener("click", () => { $("#btnPause").textContent = "일시정지"; showMenu(); });
  $("#btnSpeed").addEventListener("click", () => { S.speed = S.speed === 1 ? 2 : 1; $("#btnSpeed").textContent = S.speed + "×"; });
  $("#btnWallet").addEventListener("click", upgradeWallet);
  $("#btnCannon").addEventListener("click", fireCannon);
  $("#btnRetry").addEventListener("click", () => start(S.stage));
  $("#btnNext").addEventListener("click", () => start(Math.min(STAGES.length - 1, S.stage + 1)));
  $("#btnMenu").addEventListener("click", showMenu);
  document.addEventListener("keydown", (ev) => {
    if (ev.repeat) return;
    const k = ev.key.toLowerCase();
    if (k >= "1" && k <= "8") sendUnit(+k - 1);
    else if (k === " ") { ev.preventDefault(); fireCannon(); }
    else if (k === "w") upgradeWallet();
    else if (k === "p") pause(S.mode === "play");
  });
  document.addEventListener("visibilitychange", () => { if (document.hidden) pause(true); });

  showMenu();
  requestAnimationFrame(frame);
})();
</script>

</body></html>
